# Copy this file to .github/workflows/modelshift-check.yml in your repository.
# It fails the build when a hard-coded model ID retires within 60 days.
name: modelshift

on:
  pull_request:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Arthur031221/modelshift@v0.1.0
        with:
          days: 60
          # fail-on: retired,retiring,deprecated
